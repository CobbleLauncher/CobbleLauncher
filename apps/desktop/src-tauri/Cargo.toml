[package]
name = "cobble-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "cobble-desktop"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
cobble-core.workspace = true
cobble-content.workspace = true
cobble-auth.workspace = true
cobble-domain.workspace = true
cobble-minecraft.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "=7.0.0"
rfd = "=0.17.2"
open = "=5.4.4"
cobble-net.workspace = true
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tauri-plugin-single-instance = "=2.5.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
