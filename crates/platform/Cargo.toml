[package]
name = "cobble-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem"] }

# Narrow OS adapters: COM lifetimes and disk queries remain inside this crate.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
