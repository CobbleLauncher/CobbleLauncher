[package]
name = "cobble-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cobble-backup = { path = "../backup" }
cobble-domain.workspace = true
cobble-content.workspace = true
cobble-auth.workspace = true
cobble-minecraft.workspace = true
cobble-net.workspace = true
cobble-store.workspace = true
tokio = { workspace = true, features = ["process"] }
cap-std.workspace = true
cap-fs-ext.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
dirs = "=7.0.0"
dunce = "=1.0.5"
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }
tar.workspace = true
flate2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }

[target.'cfg(windows)'.dev-dependencies]
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
base64 = "=0.22.1"

[lints]
workspace = true
