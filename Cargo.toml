[workspace]
resolver = "3"
members = [
  "crates/backup",
  "crates/blueprint-catalog",
  "crates/diagnostics",
  "crates/modpack-inspector",
  "crates/seed-map",
  "crates/domain",
  "crates/core",
  "crates/store",
  "crates/net",
  "crates/minecraft",
  "crates/content",
  "crates/auth",
  "crates/plugin-api",
  "crates/plugin-trust",
  "crates/plugin-host",
  "crates/plugin-webview-windows",
  "crates/plugin-webview-linux",
  "crates/plugin-sdk",
  "examples/schematic-viewer",
  "examples/crash-doctor",
  "examples/modpack-inspector",
  "examples/mcs-provider",
  "examples/session-card",
  "examples/config-doctor",
  "examples/pack-metadata",
  "examples/screenshot-sheet",
  "examples/mod-conflicts",
  "examples/resource-pack-stack",
  "examples/world-dashboard",
  "examples/world-chronicle",
  "examples/command-pocket",
  "examples/seed-compass",
  "examples/coordinate-book",
  "examples/material-planner",
  "examples/play-manifest",
  "examples/lang-doctor",
  "examples/trial-copy",
  "examples/file-inbox",
  "examples/ai-assistant",
  "examples/anvil-planner",
  "examples/geometry-builder",
  "examples/backup-auditor",
  "examples/screenshot-timeline",
  "examples/controls-auditor",
  "crates/cobble-datapack-auditor-guest",
  "crates/cobble-serverbook-inspector-guest",
  "crates/cobble-storage-lens-guest",
  "crates/cobble-runtime-advisor-guest",
  "crates/platform",
  "apps/cli",
  "apps/desktop/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
cobble-core = { path = "crates/core" }
cobble-content = { path = "crates/content" }
cobble-auth = { path = "crates/auth" }
cobble-domain = { path = "crates/domain" }
cobble-store = { path = "crates/store" }
cobble-net = { path = "crates/net" }
cobble-minecraft = { path = "crates/minecraft" }
cobble-seed-map = { path = "crates/seed-map" }
jsonschema = { version = "=0.59.0", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "serialize", "limits"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
unicode-normalization = "=0.1.26"
caseless = "=0.2.2"
zip = { version = "=9.0.5", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
tar = "=0.4.46"
crc32fast = "=1.5.3"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
getrandom = "=0.4.3"
tokio = { version = "=1.54.0", features = ["net", "time", "sync", "rt", "io-util"] }
url = "=2.5.8"
http = "=1.5.0"
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
native-tls = "=0.2.18"
tokio-native-tls = "=0.3.1"
curl = { version = "=0.4.51", default-features = false, features = ["ssl"] }

[workspace.lints.rust]
unsafe_code = "forbid"

