name: Package internal Unix clients

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native package target
        type: choice
        options: [Linux, macOS, both]
        default: both
        required: true

permissions:
  contents: read

concurrency:
  group: unix-internal-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  linux:
    if: inputs.platform == 'Linux' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install native UI and smoke-test dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev xvfb xauth dbus-x11 fonts-noto-cjk openjdk-21-jre-headless webkit2gtk-driver imagemagick
      - name: Install pinned Rust and Wasm tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo install wasm-tools --version 1.262.0 --locked
          cargo install tauri-driver --version 2.1.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Package Linux x64 client
        env:
          COURSE_FORGE_API: ${{ secrets.COURSE_FORGE_API }}
        run: node scripts/package-unix.mjs --platform linux --arch x64 --embedded-curseforge-key
      - name: Smoke-test packaged Linux client
        run: python scripts/linux-native-smoke.py --binary "$(find target/test-release -maxdepth 2 -type f -name cobble-desktop -print -quit)" --output target/linux-native-smoke --require-java --require-plugin-frontend --require-titlebar-edge
      - name: Upload Linux smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobble-linux-native-smoke-${{ github.sha }}
          path: target/linux-native-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Linux internal package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobble-linux-x64-internal-${{ github.sha }}
          path: |
            target/test-release/*-linux-x64-internal.tar.gz
            target/test-release/*-linux-x64-internal.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  macos:
    if: inputs.platform == 'macOS' || inputs.platform == 'both'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned Rust and Wasm tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo install wasm-tools --version 1.262.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Package unsigned macOS app for the runner architecture
        env:
          COURSE_FORGE_API: ${{ secrets.COURSE_FORGE_API }}
        run: node scripts/package-unix.mjs --embedded-curseforge-key
      - name: Upload unsigned macOS internal package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobble-macos-internal-${{ github.sha }}
          path: |
            target/test-release/*-darwin-*-internal.tar.gz
            target/test-release/*-darwin-*-internal.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
