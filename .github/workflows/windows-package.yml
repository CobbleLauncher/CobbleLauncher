name: Package Windows client

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned Rust and Wasm tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo install wasm-tools --version 1.262.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Check packaging and local launch scripts with synthetic values
        run: node --test scripts/launch-desktop-local.test.mjs scripts/licenses.test.mjs
      - name: Build Windows package with the approved provider credential
        env:
          COURSE_FORGE_API: ${{ secrets.COURSE_FORGE_API }}
        run: pnpm package:windows --embedded-curseforge-key
      - name: Upload Windows package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobble-windows-x64-${{ github.sha }}
          path: |
            target/test-release/*.zip
            target/test-release/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
