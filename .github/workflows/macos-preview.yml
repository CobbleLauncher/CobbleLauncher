name: Publish macOS preview

on:
  workflow_dispatch:
    inputs:
      arm64_build_run:
        description: Optional successful Apple Silicon build run to publish; supply both run IDs
        type: string
        default: ''
      x64_build_run:
        description: Optional successful Intel build run to publish; supply both run IDs
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: macos-preview-release
  cancel-in-progress: false

jobs:
  package:
    if: inputs.arm64_build_run == '' && inputs.x64_build_run == ''
    name: Build ${{ matrix.arch }} macOS preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Assert native runner architecture
        run: |
          node --version
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = arm64 ]; then test "$(uname -m)" = arm64; else test "$(uname -m)" = x86_64; fi
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Reuse dependency and tool builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos-preview-${{ matrix.arch }}
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Install pinned Wasm tools
        run: |
          cargo install wasm-tools --version 1.262.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Build and package macOS ${{ matrix.arch }} preview
        env:
          COURSE_FORGE_API: ${{ secrets.COURSE_FORGE_API }}
        run: |
          package_output="${RUNNER_TEMP}/cobble-package-${{ matrix.arch }}"
          assets="${RUNNER_TEMP}/macos-assets"
          node scripts/package-unix.mjs --platform darwin --arch "${{ matrix.arch }}" --embedded-curseforge-key --adhoc-sign --output-dir "$package_output"
          mkdir -p "$assets"
          archive="$(find "$package_output" -maxdepth 1 -type f -name "*-darwin-${{ matrix.arch }}-preview.tar.gz" -print -quit)"
          test -n "$archive"
          cp "$archive" "$assets/CobbleLauncher-macos-${{ matrix.arch }}.tar.gz"
          (cd "$assets" && shasum -a 256 "CobbleLauncher-macos-${{ matrix.arch }}.tar.gz" > "CobbleLauncher-macos-${{ matrix.arch }}.tar.gz.sha256")
      - name: Upload stable-name preview assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-preview-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-assets/CobbleLauncher-macos-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish macOS prerelease
    needs: package
    if: ${{ !cancelled() && (needs.package.result == 'success' || needs.package.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      ARM64_RUN: ${{ inputs.arm64_build_run || github.run_id }}
      X64_RUN: ${{ inputs.x64_build_run || github.run_id }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify successful builds and record provenance
        env:
          REUSE_ARM64: ${{ inputs.arm64_build_run }}
          REUSE_X64: ${{ inputs.x64_build_run }}
        run: |
          if [[ -n "$REUSE_ARM64" && -z "$REUSE_X64" || -z "$REUSE_ARM64" && -n "$REUSE_X64" ]]; then
            echo "Supply both build run IDs, or leave both empty to build new packages."
            exit 1
          fi
          [[ "$ARM64_RUN" =~ ^[0-9]+$ && "$X64_RUN" =~ ^[0-9]+$ ]]
          for arch in arm64 x64; do
            if [ "$arch" = arm64 ]; then source_run="$ARM64_RUN"; else source_run="$X64_RUN"; fi
            successful_jobs="$(gh api "repos/$GH_REPO/actions/runs/$source_run/jobs?filter=all&per_page=100" --paginate \
              --jq ".jobs[] | select(.name == \"Build $arch macOS preview\" and .conclusion == \"success\") | .id")"
            test -n "$successful_jobs"
            source_sha="$(gh api "repos/$GH_REPO/actions/runs/$source_run" --jq .head_sha)"
            printf -- '- %s: %s ([CI build](%s/%s/actions/runs/%s))\n' "$arch" "$source_sha" "$GITHUB_SERVER_URL" "$GH_REPO" "$source_run" >> "$RUNNER_TEMP/macos-provenance.md"
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-preview-arm64-${{ env.ARM64_RUN }}
          run-id: ${{ env.ARM64_RUN }}
          github-token: ${{ github.token }}
          path: target/macos-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-preview-x64-${{ env.X64_RUN }}
          run-id: ${{ env.X64_RUN }}
          github-token: ${{ github.token }}
          path: target/macos-assets
      - name: Verify both architecture assets and checksums
        run: |
          test -s target/macos-assets/CobbleLauncher-macos-arm64.tar.gz
          test -s target/macos-assets/CobbleLauncher-macos-x64.tar.gz
          (cd target/macos-assets && sha256sum -c CobbleLauncher-macos-arm64.tar.gz.sha256 && sha256sum -c CobbleLauncher-macos-x64.tar.gz.sha256)
      - name: Create macOS preview prerelease
        run: |
          tag="macos-preview-${GITHUB_RUN_ID}"
          notes="${RUNNER_TEMP}/macos-preview-notes.md"
          cat > "$notes" <<'NOTES'
          macOS preview builds for Apple Silicon and Intel.

          These bundles are ad-hoc signed for local execution. They are not Developer ID signed or notarized, and native macOS acceptance has not been completed. Gatekeeper may block launch. Custom plugin frontends are disabled; tools use host-rendered fallback where available. The optional Cobble Mesh companion is not included.
          NOTES
          printf '\nBuild provenance:\n' >> "$notes"
          cat "$RUNNER_TEMP/macos-provenance.md" >> "$notes"
          gh release create "$tag" \
            target/macos-assets/CobbleLauncher-macos-arm64.tar.gz \
            target/macos-assets/CobbleLauncher-macos-arm64.tar.gz.sha256 \
            target/macos-assets/CobbleLauncher-macos-x64.tar.gz \
            target/macos-assets/CobbleLauncher-macos-x64.tar.gz.sha256 \
            --title "Cobble Launcher macOS Preview ${GITHUB_RUN_NUMBER}" \
            --notes-file "$notes" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA"
          gh release edit "$tag" --draft=false
