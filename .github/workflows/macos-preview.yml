name: Publish macOS preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-preview-release
  cancel-in-progress: false

jobs:
  package:
    name: Build ${{ matrix.arch }} macOS preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Assert native runner architecture
        run: |
          node --version
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = arm64 ]; then test "$(uname -m)" = arm64; else test "$(uname -m)" = x86_64; fi
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Reuse dependency and tool builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos-preview-${{ matrix.arch }}
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Install pinned Wasm tools
        run: |
          cargo install wasm-tools --version 1.262.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Build and package macOS ${{ matrix.arch }} preview
        env:
          COURSE_FORGE_API: ${{ secrets.COURSE_FORGE_API }}
        run: |
          node scripts/package-unix.mjs --platform darwin --arch "${{ matrix.arch }}" --embedded-curseforge-key --adhoc-sign
          mkdir -p target/macos-assets
          archive="$(find target/test-release -maxdepth 1 -type f -name "*-darwin-${{ matrix.arch }}-preview.tar.gz" -print -quit)"
          test -n "$archive"
          cp "$archive" "target/macos-assets/CobbleLauncher-macos-${{ matrix.arch }}.tar.gz"
          (cd target/macos-assets && shasum -a 256 "CobbleLauncher-macos-${{ matrix.arch }}.tar.gz" > "CobbleLauncher-macos-${{ matrix.arch }}.tar.gz.sha256")
      - name: Upload stable-name preview assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-preview-${{ matrix.arch }}-${{ github.run_id }}
          path: target/macos-assets/CobbleLauncher-macos-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish macOS prerelease
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-preview-*-${{ github.run_id }}
          path: target/macos-assets
          merge-multiple: true
      - name: Verify both architecture assets and checksums
        run: |
          test -s target/macos-assets/CobbleLauncher-macos-arm64.tar.gz
          test -s target/macos-assets/CobbleLauncher-macos-x64.tar.gz
          (cd target/macos-assets && sha256sum -c CobbleLauncher-macos-arm64.tar.gz.sha256 && sha256sum -c CobbleLauncher-macos-x64.tar.gz.sha256)
      - name: Create macOS preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="macos-preview-${GITHUB_RUN_ID}"
          notes="${RUNNER_TEMP}/macos-preview-notes.md"
          cat > "$notes" <<'NOTES'
          macOS preview builds for Apple Silicon and Intel.

          These bundles are ad-hoc signed for local execution. They are not Developer ID signed or notarized, and native macOS acceptance has not been completed. Gatekeeper may block launch. Custom plugin frontends are disabled; tools use host-rendered fallback where available. The optional Cobble Mesh companion is not included.
          NOTES
          gh release create "$tag" \
            target/macos-assets/CobbleLauncher-macos-arm64.tar.gz \
            target/macos-assets/CobbleLauncher-macos-arm64.tar.gz.sha256 \
            target/macos-assets/CobbleLauncher-macos-x64.tar.gz \
            target/macos-assets/CobbleLauncher-macos-x64.tar.gz.sha256 \
            --title "Cobble Launcher macOS Preview ${GITHUB_RUN_NUMBER}" \
            --notes-file "$notes" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA"
          gh release edit "$tag" --draft=false
