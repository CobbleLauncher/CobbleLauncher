# Locked dependency policy. Do not add copyleft/unknown license exceptions silently.
[graph]
all-features = false

[licenses]
confidence-threshold = 0.95
include-dev = true
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "Unlicense", "BSL-1.0"]
unused-allowed-license = "allow"

# Unmodified general-purpose transitive dependencies of Tauri/Wry, not launcher
# implementations. Exact sources/notices are recorded in THIRD_PARTY_NOTICES.md.
# This does not globally permit MPL or approve a public distribution.
[[licenses.exceptions]]
crate = "cssparser@0.37.0"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "cssparser-macros@0.7.1"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "dtoa-short@0.3.5"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "option-ext@0.2.0"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "selectors@0.38.0"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
yanked = "deny"
git-fetch-with-cli = false
maximum-db-staleness = "P1D"
# A maintenance notice, not a vulnerability exemption. GTK3's pinned proc-macro
# dependency has no compatible upgrade through Tauri 2. Keep it visible and
# reassess at every Tauri/GTK update and before Linux release (THIRD_PARTY_NOTICES.md).
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Unmaintained proc-macro-error 1.0.4 in Linux GTK3 build macros; no patched compatible release. Explicit maintenance risk tracked in THIRD_PARTY_NOTICES.md; no vulnerability advisory is ignored." }
]
